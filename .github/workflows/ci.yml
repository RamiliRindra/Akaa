name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Le job `e2e` a ete retire le 2026-09-21. Il portait
# `if: ${{ secrets.DATABASE_URL != '' }}` au niveau du job, or le contexte
# `secrets` n'y est pas accessible : GitHub refusait de parser le fichier
# ENTIER. Consequence mesuree : depuis avril 2026, les huit derniers runs de
# ce workflow — y compris sur main — echouaient en 0 seconde avec « This run
# likely failed because of a workflow file issue », et `quality` n'a jamais
# tourne une seule fois. Le depot paraissait couvert par une CI qui n'existait
# pas.
# Le job exigeait de toute facon une base Postgres de test qui n'a jamais ete
# fournie : il serait reste inerte meme repare. Le retablir suppose d'abord
# cette base, puis un drapeau sorti du job `quality` (un `if` de job peut lire
# `needs`, jamais `secrets`).
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test